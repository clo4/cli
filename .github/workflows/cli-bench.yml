name: CLI Benchmark

on:
  push:
    branches: [main]
    paths:
      - src/**
      - bench/**
      - tsdown.config.ts
      - tsdown.bench.config.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/cli-bench.yml

# Every push gets its own benchmark row. Up to 100 runs wait their turn in
# order, so one run never cancels another and history pushes never race.
concurrency:
  group: cli-bench-${{ github.ref }}
  queue: max

env:
  HISTORY_BRANCH: cli-framework-benchmarks
  # One line of JSON per run. history.csv and history-v2.csv hold the earlier
  # CSV rows. Their @clo4/cli times include completion's code in every
  # scenario, which adds about 0.1 to 0.2 ms to each.
  #
  # The large CLIs changed after e805b31:
  # - @clo4/cli's "N commands" rows built the whole spec at startup. They
  #   now use `loadSpec` in one file, which e805b31 recorded as
  #   "N commands, loadSpec in one file". "N commands, whole spec" rows
  #   build the whole spec.
  # - e805b31's "N commands, loadSpec, a file per group" rows are now
  #   "N commands, a file per group".
  # - The parseArgs CLI was one table of every command. It now has groups,
  #   builds only the group a command line enters, and prints help.
  # - Yargs, Cliffy, Stricli and gunshi have large CLIs for the first time.
  # - Each large CLI also runs root help, a group's help and an unknown
  #   command. The "large" comparison is now one comparison for each form
  #   and kind of work, with groups named like "large:command".
  HISTORY_FILE: history.jsonl

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # The benchmark step took 26 minutes for 135 jobs at e805b31. There are
    # now 247 jobs, so a run should take about 48 minutes.
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile

      - name: Run benchmark
        run: |
          pnpm bench --samples=150 --json-out "$GITHUB_WORKSPACE/bench-run.jsonl" \
            | tee bench-output.txt

      - name: Publish results to job summary
        if: always()
        run: |
          {
            echo '## @clo4/cli benchmark'
            echo
            echo '> Shared CI runners vary from run to run. Compare libraries within one run, not absolute numbers across runs.'
            echo
            echo '```'
            cat bench-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record benchmark history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          work="$(mktemp -d)"
          if git fetch origin "$HISTORY_BRANCH" 2>/dev/null; then
            git worktree add -B "$HISTORY_BRANCH" "$work" FETCH_HEAD
          else
            # First run: start the branch as a fresh root with no shared history.
            git worktree add --orphan -b "$HISTORY_BRANCH" "$work"
          fi

          hist="$work/$HISTORY_FILE"
          if [ -f "$hist" ] && grep -q "\"commit\":\"$GITHUB_SHA\"" "$hist"; then
            echo "Commit $GITHUB_SHA already recorded; skipping."
          else
            cat "$GITHUB_WORKSPACE/bench-run.jsonl" >> "$hist"
            git -C "$work" add "$HISTORY_FILE"
            git -C "$work" commit -m "bench: record $GITHUB_SHA"
            git -C "$work" push origin "$HISTORY_BRANCH"
          fi

          git worktree remove --force "$work"
